services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data:/app/data

  postgres:
    image: postgres:16-alpine

    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  dashboard:
    build: .

    command: uv run streamlit run src/monitoring/dashboard.py --server.address 0.0.0.0 --server.port 8501

    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8501:8501"

  kestra:
    image: kestra/kestra:latest
    user: "root"
    command: server local
    environment:
      - ENV_GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - kestra_data:/app/storage
      - kestra_db:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    ports:
      - "8080:8080"
volumes:
  app_data:
    name: cattle_raising_assistant_app_data
  kestra_data:
  kestra_db:
  postgres_data: